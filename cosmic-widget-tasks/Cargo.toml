[package]
name = "cosmic-widget-tasks"
version = "0.1.0"
description = "Desktop layer-shell widget for COSMIC showing overdue/due-today tasks from an Obsidian vault (Tasks plugin syntax)"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "autosize",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
cosmic-widget-common = { path = "../cosmic-widget-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["clock"] }
