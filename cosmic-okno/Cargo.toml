[package]
name = "cosmic-okno"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db", default-features = false, features = ["client"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = "s"
strip = true
