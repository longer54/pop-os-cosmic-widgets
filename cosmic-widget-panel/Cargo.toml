[package]
name = "cosmic-widget-panel"
version = "0.1.0"
description = "Desktop layer-shell widget for COSMIC showing service status from a custom JSON status endpoint"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[dependencies]
cosmic = { package = "libcosmic", git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "autosize",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time"] }
dirs = "5"
